[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vkong-connect"
version = "0.1.0.dev0"
description = "Thin adapter and runner layer for product workloads on VKong"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "TLI Tech"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vkong-connect-runner = "vkong_connect.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vkong_connect.adapters.unsloth" = ["image-catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
