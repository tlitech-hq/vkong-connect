name: checks

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and fake CLI contracts
        run: make test
      - name: Install package and verify catalog resource
        run: |
          python -m pip install --no-deps .
          cd /tmp
          python -c 'from vkong_connect.adapters.unsloth.image_catalog import ImageCatalog; assert ImageCatalog.packaged().entries == ()'
